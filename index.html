<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasker - Afspraak Dialyse</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --border-color: #cbd5e1;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 750px; margin: 0 auto; }
        h1 { font-size: 1.4rem; color: var(--primary-color); margin-bottom: 5px; }
        .subtitle { font-size: 0.9rem; color: #64748b; margin-bottom: 20px; }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .full-width { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fff;
            color: var(--text-color);
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { font-weight: 600; background-color: #f8fafc; }
        .badge {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
            background-color: #e0f2fe;
            color: #0369a1;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Tasker - Afspraak Dialyse</h1>
    <div class="subtitle">Beheer uw dialyse afspraken (start- en stoptijden zijn niet verplicht).</div>
    
    <div class="card">
        <h3>Nieuwe Afspraak Inplannen</h3>
        <form id="appointmentForm" onsubmit="saveAppointment(event)">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="appDateTime">Afspraak Datum & Tijd (Vormt uniek ID)</label>
                    <input type="datetime-local" id="appDateTime" required>
                </div>
                <div class="form-group">
                    <label for="startDateTime">Start Datum & Tijd (Optioneel)</label>
                    <input type="datetime-local" id="startDateTime">
                </div>
                <div class="form-group">
                    <label for="stopDateTime">Stop Datum & Tijd (Optioneel)</label>
                    <input type="datetime-local" id="stopDateTime">
                </div>
                <div class="form-group">
                    <label for="dialysisType">Soort Dialyse</label>
                    <select id="dialysisType" required>
                        <option value="Nacht (0,3)">Nacht (0,3)</option>
                        <option value="Dag (0,6)">Dag (0,6)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="recurrence">Herhaling</label>
                    <select id="recurrence" required>
                        <option value="Geen">Geen</option>
                        <option value="Om de dag">Om de dag</option>
                        <option value="Elke dag">Elke dag</option>
                        <option value="Ma, Wo, Vrij">Ma, Wo, Vrij</option>
                        <option value="Di, Do, Za">Di, Do, Za</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="recurrenceEndDate">Herhaling Einddatum</label>
                    <input type="date" id="recurrenceEndDate">
                </div>
            </div>
            <button type="submit" class="btn">Afspraak Opslaan</button>
        </form>
    </div>

    <div class="card">
        <h3>Overzicht Geplande Afspraken</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID / Afspraak Tijd</th>
                        <th>Start & Stop</th>
                        <th>Soort</th>
                        <th>Herhaling & Einddatum</th>
                        <th>Actie</th>
                    </tr>
                </thead>
                <tbody id="appTableBody">
                    <!-- Dynamisch -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        
        const currentFormatted = `${year}-${month}-${day}T${hours}:${minutes}`;
        document.getElementById('appDateTime').value = currentFormatted;
        
        document.getElementById('startDateTime').value = currentFormatted;
        
        const stopDate = new Date(now.getTime() + 8 * 60 * 60 * 1000);
        const sYear = stopDate.getFullYear();
        const sMonth = String(stopDate.getMonth() + 1).padStart(2, '0');
        const sDay = String(stopDate.getDate()).padStart(2, '0');
        const sHours = String(stopDate.getHours()).padStart(2, '0');
        const sMinutes = String(stopDate.getMinutes()).padStart(2, '0');
        document.getElementById('stopDateTime').value = `${sYear}-${sMonth}-${sDay}T${sHours}:${sMinutes}`;

        const endDateObj = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000);
        document.getElementById('recurrenceEndDate').value = endDateObj.toISOString().split('T')[0];

        loadAppointments();
    });

    function getAppointments() {
        return JSON.parse(localStorage.getItem('tasker_appointments_v4') || '[]');
    }

    function saveAppointment(e) {
        e.preventDefault();
        const appDateTime = document.getElementById('appDateTime').value;
        const startDateTime = document.getElementById('startDateTime').value;
        const stopDateTime = document.getElementById('stopDateTime').value;
        const dialysisType = document.getElementById('dialysisType').value;
        const recurrence = document.getElementById('recurrence').value;
        const recurrenceEndDate = document.getElementById('recurrenceEndDate').value;

        const uniqueId = appDateTime.replace(/[-T:]/g, '');

        const newAppointment = {
            id: uniqueId,
            appDateTime,
            startDateTime,
            stopDateTime,
            dialysisType,
            recurrence,
            recurrenceEndDate
        };

        let list = getAppointments();
        list = list.filter(item => item.id !== uniqueId);
        list.unshift(newAppointment);
        
        localStorage.setItem('tasker_appointments_v4', JSON.stringify(list));

        alert("Afspraak opgeslagen! (ID: " + uniqueId + ")");
        loadAppointments();
    }

    function loadAppointments() {
        const list = getAppointments();
        const tbody = document.getElementById('appTableBody');
        tbody.innerHTML = "";
        
        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#888;">Geen afspraken gevonden.</td></tr>`;
            return;
        }

        list.forEach(item => {
            const tr = document.createElement('tr');
            let recInfo = item.recurrence;
            if (item.recurrence !== 'Geen' && item.recurrenceEndDate) {
                recInfo += `<br><small>t/m ${item.recurrenceEndDate}</small>`;
            }

            let startStopText = "Niet ingevuld";
            if (item.startDateTime || item.stopDateTime) {
                const startStr = item.startDateTime ? item.startDateTime.replace('T', ' ') : '-';
                const stopStr = item.stopDateTime ? item.stopDateTime.replace('T', ' ') : '-';
                startStrText = `Start: ${startStr}<br>Stop: ${stopStr}`;
                startStopText = `Start: ${startStr}<br>Stop: ${stopStr}`;
            }

            tr.innerHTML = `
                <td><strong>${item.id}</strong><br><small>${item.appDateTime.replace('T', ' ')}</small></td>
                <td>${startStopText}</td>
                <td><span class="badge">${item.dialysisType}</span></td>
                <td>${recInfo}</td>
                <td><button class="btn btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteAppointment('${item.id}')">Wis</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteAppointment(id) {
        if (!confirm("Weet u zeker dat u deze afspraak wilt verwijderen?")) return;
        let list = getAppointments().filter(item => item.id !== id);
        localStorage.setItem('tasker_appointments_v4', JSON.stringify(list));
        loadAppointments();
    }
</script>
</body>
</html>
